version: 2

# ^ref: https://goreleaser.com/errors/multiple-tokens/
force_token: github

# ^ref: https://goreleaser.com/customization/project/
project_name: evolve

# ^ref: https://goreleaser.com/customization/hooks/
before:
  hooks:
    - go mod download
    # Build the embedded report-viewer SPA so the -tags=withui build below can
    # embed internal/web/ui/dist (git-ignored, like the docs site).
    - npm --prefix internal/web/ui ci --no-fund --no-audit
    - npm --prefix internal/web/ui run build

# ^ref: https://goreleaser.com/customization/env/
env:
  - CGO_ENABLED=0

# ^ref: https://goreleaser.com/customization/build/
# Cross-platform binaries: keyless cosign signatures over linux/windows and
# Developer ID-signed, notarized darwin binaries (notarize.macos below).
builds:
  - id: evolve
    main: ./cmd/evolve
    binary: evolve
    flags:
      - -trimpath
    # withui embeds the report-viewer SPA built in the before-hook above.
    tags:
      - withui
    # shared with the darwin build below (same binary, split only by goos)
    ldflags: &evolve_ldflags
      - -s -w
      - -X github.com/bitwise-media-group/evolve/internal/version.Version={{ .Version }}
      - -X github.com/bitwise-media-group/evolve/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/bitwise-media-group/evolve/internal/version.BuildDate={{ .Date }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  # darwin is a separate build id purely so binary_signs (cosign) can exclude
  # it by id: goreleaser runs binary_signs BEFORE notarize, and notarization
  # rewrites the Mach-O in place, so a cosign bundle over the pre-notarized
  # bytes would never verify against the shipped binary. The OSS binary_signs
  # has no per-artifact `if`, so the build id is the only handle. Archive
  # names are unchanged (the template keys on Binary/Os/Arch, not the id), and
  # dockers_v2 keeps sourcing its linux binaries from the `evolve` id.
  - id: evolve-darwin
    main: ./cmd/evolve
    binary: evolve
    flags:
      - -trimpath
    tags:
      - withui
    ldflags: *evolve_ldflags
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

# ^ref: https://goreleaser.com/customization/archive/
archives:
  - id: evolve
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      # Ship the man pages in the archive so the Homebrew cask can install
      # them from the extracted tarball (see homebrew_casks.manpages below).
      - docs/man/*.1
      # Pre-generated shell completions (committed by `mise run docs`), so
      # the cask installs them as static files instead of executing the
      # binary at install time (see homebrew_casks.completions below).
      - completions/*

# ^ref: https://goreleaser.com/customization/docker_v2/
# The evolve-runner images patchy's evaluation Jobs run: evolve + one harness
# CLI each (`evolve exec-unit` is the entrypoint's hidden in-pod verb). The
# Dockerfiles only assemble the runtime layer around the binaries GoReleaser
# compiled — they cannot be `docker build` directly from the repo.
dockers_v2:
  - id: runner-claude
    ids: [evolve]
    dockerfile: Dockerfile.runner-claude
    images:
      - ghcr.io/bitwise-media-group/evolve-runner-claude
    tags:
      - v{{ .Version }}
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/bitwise-media-group/evolve
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
  - id: runner-codex
    ids: [evolve]
    dockerfile: Dockerfile.runner-codex
    images:
      - ghcr.io/bitwise-media-group/evolve-runner-codex
    tags:
      - v{{ .Version }}
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/bitwise-media-group/evolve
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
  - id: runner-copilot
    ids: [evolve]
    dockerfile: Dockerfile.runner-copilot
    images:
      - ghcr.io/bitwise-media-group/evolve-runner-copilot
    tags:
      - v{{ .Version }}
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/bitwise-media-group/evolve
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

# ^ref: https://goreleaser.com/customization/checksum/
checksum:
  name_template: checksums.txt

# ^ref: https://goreleaser.com/customization/sign/sign/
# Keyless cosign signatures over the linux/windows binaries; the reusable
# release workflow supplies the GitHub Actions OIDC token. The darwin binaries
# are excluded by build id and carry the Apple signature + notarization below
# instead (cosign runs before notarize and would sign the wrong bytes); the
# SLSA attestation over checksums.txt still covers their archives.
binary_signs:
  - cmd: cosign
    ids: [evolve]
    signature: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

# ^ref: https://goreleaser.com/customization/sign/notarize/
# Developer ID signing + Apple notarization of the darwin binaries, done
# cross-platform by goreleaser's embedded quill (no macOS runner). Certificate
# and API key arrive as env from the reusable release workflow, from the org
# secrets shared by every open-source repo that notarizes.
# enabled: every real release notarizes and fails if the secrets are missing
# (a published release is never un-notarized, which is what lets the cask
# skip the quarantine workaround); a snapshot only does when MACOS_SIGN_P12 is
# exported, so `mise run snapshot` stays offline and a local end-to-end test
# is one env export away.
notarize:
  macos:
    - enabled: '{{ or (not .IsSnapshot) (isEnvSet "MACOS_SIGN_P12") }}'
      ids: [evolve-darwin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 15m

# ^ref: https://goreleaser.com/customization/sbom/
sboms:
  - artifacts: archive
    # syft is installed from the make/ library's .syft-version pin into .bin/,
    # which the library's snapshot/release targets put on PATH.
    cmd: syft
    args:
      - $artifact
      - --output
      - spdx-json=$document

# ^ref: https://goreleaser.com/customization/publish/snapshots/
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# ^ref: https://goreleaser.com/customization/publish/changelog/
changelog:
  sort: asc
  use: github
  format: '{{ .SHA }}: {{ .Message }}{{ if and (not .IsNightly) .Logins }} ({{ .Logins | englishJoin }}){{ end }}'

  filters:
    exclude:
      - "^test"
      - "^chore"
      - "^build"
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Security Updates"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 150
    - title: "Bug Fixes"
      regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: "Documentation Updates"
      regexp: ^.*?docs?(\(.+\))??!?:.+$
      order: 400
    - title: Other Work
      order: 9999

# ^ref: https://goreleaser.com/customization/publish/scm/
release:
  github:
    owner: bitwise-media-group
    name: evolve
  # The release-please job in release.yaml leaves a draft release named after
  # the tag it pushes. Adopt that draft instead of creating a second release,
  # swap its release-please notes for the grouped changelog above, and
  # leave it a draft: the reusable release workflow runs GoReleaser with
  # --draft and publishes it last, once the assets, cask and attestations land.
  use_existing_draft: true
  mode: replace

# ^ref: https://goreleaser.com/customization/publish/homebrew_casks/
homebrew_casks:
  - name: evolve
    binaries: [evolve]
    # Glob-matched against the files bundled into the archive above; goreleaser
    # emits a `manpage "..."` stanza for each match (e.g. docs/man/evolve.1).
    manpages:
      - docs/man/*.1
    # Static completion stanzas, NOT generate_completions_from_executable:
    # the committed completions/* are deterministic output of `mise run docs`
    # and install as plain files, so the cask never executes the binary at
    # install time and the install is reproducible from the archive alone.
    # (Static bash_completion / zsh_completion / fish_completion artifacts are
    # also ordered deterministically by Homebrew, which GeneratedCompletion —
    # missing from brew's artifact sort table as of 6.0 — is not.)
    completions:
      bash: completions/evolve.bash
      zsh: completions/evolve.zsh
      fish: completions/evolve.fish
    homepage: https://github.com/bitwise-media-group/evolve
    description: Evaluate coding-agent plugins — static checks, trigger-accuracy evals, behavioral cases, and reports
    skip_upload: auto
    repository:
      owner: bitwise-media-group
      name: homebrew-tap
      # The cask lands as a pull request from bot/evolve-<tag> (bot/** is exempt
      # from the org fork-only ruleset), never a push to main: the reusable
      # release workflow merges it only after it publishes the draft release,
      # so the tap never points at assets that do not exist yet. The token is
      # a short-lived FF Merge App token the workflow mints for the tap alone.
      branch: bot/evolve-{{ .Tag }}
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: bitwise-media-group
          name: homebrew-tap
          branch: main

