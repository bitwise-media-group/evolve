# Keep the app module deps, the shared Makefile library submodule, npm lint
# tools, uv docs tooling, and SHA-pinned actions fresh.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7
    commit-message:
      include: scope
      prefix: deps
      prefix-development: deps
    schedule:
      interval: daily
    groups:
      # Grouped security updates: one PR per sweep instead of one per advisory.
      # Groups only apply to version updates unless applies-to says otherwise.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # The otel/log API, SDK, exporters, and contrib bridges are separate
      # modules that only compile against matching release trains — a lone
      # bump (e.g. sdk/log 0.21.0 without otelslog 0.20.0) fails the build,
      # so ship the whole family as one PR.
      opentelemetry:
        patterns:
          - go.opentelemetry.io/*
      # The x/ repos cut releases together; one PR per sweep.
      golang-x:
        patterns:
          - golang.org/x/*
      # grpc + genproto + protobuf move in lockstep (genproto is a pseudo-
      # versioned pair that bumps almost daily); keep them to one PR.
      google:
        patterns:
          - google.golang.org/*
      # The Charm TUI stack (bubbletea/bubbles/lipgloss + charmbracelet/x)
      # tracks shared internals across repos; bump as one PR.
      charm:
        patterns:
          - charm.land/*
          - github.com/charmbracelet/*
      # Prometheus client family, all indirect via the autoexport exporter.
      prometheus:
        patterns:
          - github.com/prometheus/*
      # cobra/pflag/viper and their shared spf13 helpers.
      spf13:
        patterns:
          - github.com/spf13/*

  # The pinned Go dev CLIs (addlicense, golangci-lint, goreleaser, ...) no longer
  # live in a tools/go.mod — they come from the toolchain submodule's mise pins
  # at .mise/. Track the submodule so a library release (a new `release` branch
  # head) flows here as a bump.
  - package-ecosystem: gitsubmodule
    directory: /
    cooldown:
      default-days: 7
      # our own toolchain submodule ships straight through — no cooldown wait.
      # Dependabot names a submodule dependency by its path, so exclude ".mise"
      # (not an owner glob like the actions ecosystem uses).
      exclude:
        - .mise
    commit-message:
      include: scope
      prefix: build
      prefix-development: build
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: deps
      prefix-development: build
      include: scope
    cooldown:
      default-days: 7
      # our own actions ship straight through — no cooldown wait
      exclude:
        - bitwise-media-group/*
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        patterns:
          - actions/*
      github:
        patterns:
          - github/*
      bitwise-media-group:
        patterns:
          - bitwise-media-group/*

  # The report-viewer SPA's deps (the root prose-only package.json is gone —
  # the prose linters come from the toolchain's mise pins).
  - package-ecosystem: npm
    directory: /internal/web/ui
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      dev-tooling:
        patterns:
          - "*"

  # uv project deps (pyproject.toml + uv.lock) — currently just zensical, which
  # builds and publishes the documentation site. Treated as build tooling.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      docs-tooling:
        patterns:
          - "*"
