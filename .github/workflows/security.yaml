# Security analysis — thin caller for the org's reusable security workflow. It runs
# CodeQL over the repository's GitHub Actions workflows (build-free) and the Go
# module (autobuild; go from the mise pins), on every push and pull request plus a
# weekly scheduled run so newly published queries reach already-merged code.
#
# languages is pinned to "actions,go": root detection would otherwise add an empty
# javascript-typescript leg from package.json, which is prose-linting tooling only
# (markdownlint/prettier) with no product JavaScript to scan.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "28 20 * * 4"

# ceiling for the reusable workflow's analyze job
permissions:
  # upload analysis results to code scanning
  security-events: write
  # fetch internal or private CodeQL packs
  packages: read
  # only required for workflows in private repositories
  actions: read
  # check out the repository
  contents: read

jobs:
  analyze:
    uses: bitwise-media-group/github-workflows/.github/workflows/security.yaml@2d3b2608662b272b8e5036236e82144507d8bb67 # v7.0.1
    with:
      languages: actions,go
