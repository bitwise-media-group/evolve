# Continuous integration — thin caller for the org's reusable ci workflow. It runs
# the canonical mise tasks (lint, build, test) as one parallel job each, then
# Codecov uploads from coverage/cobertura-coverage.xml (coverage) and
# coverage/junit.xml (test results) — both emitted by `mise run test`.
# `mise run lint` carries all check-mode static analysis — golangci-lint,
# govulncheck, prettier --check, markdownlint, addlicense, actionlint, zizmor.
# Go comes from the root mise.toml pin and Node (for the embedded report-viewer
# UI) from the toolchain submodule's pins.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@2d3b2608662b272b8e5036236e82144507d8bb67 # v7.0.1
